<!doctype html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root{font-family:Arial,"Noto Sans Thai",sans-serif;color:#18372c;--green:#197b5a;--dark:#123f32;--line:#dce5df;--muted:#6d7b73;--danger:#b3261e}
    *{box-sizing:border-box}body{margin:0;background:#f6f8f6;font-size:13px}.app{padding:15px}.head{background:var(--dark);color:#fff;border-radius:14px;padding:17px;margin-bottom:12px}.head h1{font-size:18px;margin:0 0 4px}.head p{font-size:11px;color:#c6d8d0;margin:0}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#e8eeea;border-radius:10px;padding:4px;margin-bottom:12px}.tabs button{border:0;border-radius:7px;background:transparent;padding:9px;color:#617068;cursor:pointer}.tabs button.active{background:#fff;color:var(--green);font-weight:700;box-shadow:0 1px 4px #00000012}
    .card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:11px}.card h2{font-size:14px;margin:0 0 11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label span{display:block;font-size:10px;color:var(--muted);font-weight:700;margin:0 0 4px 2px}input,select{width:100%;border:1px solid #cfd9d2;border-radius:8px;background:#fff;padding:8px 9px;min-height:36px;font:inherit;color:#243d33}input:focus,select:focus{outline:2px solid #197b5a22;border-color:var(--green)}.actions{display:flex;gap:7px;margin-top:12px}.btn{border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:700}.primary{background:var(--green);color:#fff}.secondary{background:#edf2ef;color:#345146}.danger{background:#fff0ef;color:var(--danger)}.btn:disabled{opacity:.5;cursor:wait}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px}.summary div{background:#ffffff12;border:1px solid #ffffff1c;border-radius:8px;padding:7px;text-align:center}.summary strong{display:block;font-size:15px}.summary span{font-size:8px;color:#c6d8d0}
    .toolbar{display:grid;grid-template-columns:1fr 112px auto;gap:7px;margin-bottom:9px}.toolbar button{white-space:nowrap}.list{display:grid;gap:7px}.row{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.rowtop{display:flex;align-items:flex-start;justify-content:space-between;gap:7px}.row strong{font-size:12px}.meta{font-size:10px;color:var(--muted);margin-top:4px}.rowbuttons{display:flex;gap:4px}.icon{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 7px;cursor:pointer;font-size:10px}.archived{opacity:.62}.badge{font-size:9px;padding:2px 6px;border-radius:20px;background:#e9f5ef;color:var(--green)}.badge.arch{background:#eee;color:#666}.paging{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-size:10px}.paging button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px;cursor:pointer}.notice{position:sticky;bottom:8px;padding:10px 12px;border-radius:9px;background:var(--dark);color:#fff;box-shadow:0 8px 24px #0003;margin-top:10px}.notice.error{background:var(--danger)}.hidden{display:none}.loading{opacity:.55;pointer-events:none}.system{display:flex;gap:6px;flex-wrap:wrap}.system .btn{font-size:10px;padding:7px 9px}
  </style>
</head>
<body>
<div class="app" id="app">
  <section class="head"><h1>จัดการข้อมูลการเกษตร</h1><p id="identity">กำลังตรวจสอบระบบ…</p><div class="summary" id="summary"></div></section>
  <div class="tabs"><button id="tabAnnual" class="active" onclick="switchType('annual')">ข้อมูลรายปี</button><button id="tabMonthly" onclick="switchType('monthly')">ข้อมูลรายเดือน</button></div>
  <section class="card">
    <h2>นำเข้าข้อมูลและสิทธิ์ผู้ดูแล</h2><p id="accessInfo" class="meta">กำลังตรวจสอบสิทธิ์…</p>
    <div class="grid"><label class="full"><span>ชุดข้อมูล</span><select id="importKind" onchange="$('registrationFields').classList.toggle('hidden',this.value!=='registration')"><option value="unified">ข้อมูลเอกภาพ (9 ชนิดพืช)</option><option value="registration">ข้อมูลผลการขึ้นทะเบียน</option></select></label>
      <div id="registrationFields" class="grid full hidden"><label><span>ชนิดพืช *</span><select id="importCrop"></select></label><label><span>ประเภทพื้นที่ *</span><select id="metricType"><option value="planted">พื้นที่ปลูก</option><option value="harvested">พื้นที่เก็บเกี่ยว</option></select></label></div>
      <label class="full"><span>ไฟล์ CSV (UTF-8)</span><input id="csvFile" type="file" accept=".csv,text/csv"></label></div>
    <div class="actions"><button class="btn primary" id="importButton" type="button" onclick="importCsv()">ตรวจสอบและนำเข้า</button><button class="btn secondary" id="requestButton" type="button" onclick="requestAccess()">ขอสิทธิ์ผู้ช่วยดูแล</button></div>
  </section>

  <section class="card">
    <h2 id="formTitle">เพิ่มข้อมูลรายปี</h2>
    <form id="recordForm" onsubmit="submitForm(event)">
      <input type="hidden" id="recordId">
      <div class="grid">
        <label><span>ปี พ.ศ. *</span><input id="year_be" type="number" min="2400" max="2700" required></label>
        <label id="monthField" class="hidden"><span>เดือน *</span><select id="month_number"></select></label>
        <label><span>อำเภอ *</span><select id="district_code" required></select></label>
        <label><span>ชนิดพืช *</span><select id="crop_code" required></select></label>
        <label id="plantedField"><span>พื้นที่เพาะปลูก (ไร่)</span><input id="planted_area_rai" type="number" min="0" step="any"></label>
        <label id="harvestedField"><span>พื้นที่เก็บเกี่ยว (ไร่)</span><input id="harvested_area_rai" type="number" min="0" step="any"></label>
        <label id="productionField"><span>ผลผลิต (ตัน)</span><input id="production_ton" type="number" min="0" step="any"></label>
        <label id="householdField" class="hidden"><span>ครัวเรือนเกษตรกร</span><input id="farmer_households" type="number" min="0" step="any"></label>
        <label id="sourceYieldField"><span>ผลผลิตเฉลี่ยต้นทาง (กก./ไร่)</span><input id="source_yield_harvested_kg_per_rai" type="number" min="0" step="any"></label>
        <label><span>สถานะ *</span><select id="record_status"><option value="active">เผยแพร่ (active)</option><option value="draft">ฉบับร่าง (draft)</option><option value="archived">เก็บถาวร (archived)</option></select></label>
        <label class="full"><span>แหล่งข้อมูล</span><input id="source_sheet" value="Data Manager"></label>
      </div>
      <div class="actions"><button class="btn primary" id="saveButton" type="submit">บันทึกข้อมูล</button><button class="btn secondary" type="button" onclick="resetForm()">ล้างแบบฟอร์ม</button></div>
    </form>
  </section>

  <section class="card">
    <div class="toolbar"><input id="search" placeholder="ค้นหารหัส ปี อำเภอ หรือพืช" oninput="scheduleSearch()"><select id="statusFilter" onchange="loadRecords(1)"><option value="">ทุกสถานะ</option><option value="active">เผยแพร่</option><option value="draft">ฉบับร่าง</option><option value="archived">เก็บถาวร</option></select><button class="btn secondary" onclick="loadRecords(1)">ค้นหา</button></div>
    <div id="recordList" class="list"></div>
    <div class="paging"><button id="prev" onclick="loadRecords(state.page-1)">ก่อนหน้า</button><span id="pageInfo"></span><button id="next" onclick="loadRecords(state.page+1)">ถัดไป</button></div>
  </section>

  <section class="card"><h2>เครื่องมือระบบ</h2><div class="system"><button class="btn secondary" onclick="integrityCheck()">ตรวจข้อมูลซ้ำ</button><button class="btn secondary" onclick="fullBackup()">สำรองทั้งไฟล์</button></div></section>
  <div id="notice" class="notice hidden"></div>
</div>
<script>
  const state={type:'annual',page:1,pageSize:25,total:0,bootstrap:null,timer:null};
  const $=id=>document.getElementById(id);
  const call=(name,arg)=>new Promise((resolve,reject)=>{
    let runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error.message||String(error))));
    arg===undefined?runner[name]():runner[name](arg);
  });
  const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function busy(value){$('app').classList.toggle('loading',value)}
  function notify(message,error=false){const el=$('notice');el.textContent=message;el.className='notice'+(error?' error':'');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.className='notice hidden',4200)}
  function fillSelect(id,items,label){$(id).innerHTML='<option value="">'+label+'</option>'+items.map(x=>`<option value="${escapeHtml(x.code)}">${escapeHtml(x.name)}</option>`).join('')}
  async function init(){
    try{
      state.bootstrap=await call('getBootstrap');
      $('identity').textContent=`เวอร์ชัน ${state.bootstrap.version} · ${state.bootstrap.userEmail}`;
      renderSummary();
      fillSelect('district_code',state.bootstrap.districts,'เลือกอำเภอ');
      fillSelect('crop_code',state.bootstrap.crops,'เลือกชนิดพืช');
      fillSelect('importCrop',state.bootstrap.crops,'เลือกชนิดพืช');
      fillSelect('month_number',state.bootstrap.months,'เลือกเดือน');
      await refreshAccess();
      await loadRecords(1);
    }catch(error){notify(error.message,true)}
  }
  function renderSummary(){
    const summary=state.bootstrap.summary[state.type];
    $('summary').innerHTML=[
      ['ทั้งหมด',summary.total],['เผยแพร่',summary.active],['ฉบับร่าง',summary.draft],['เก็บถาวร',summary.archived],
    ].map(item=>`<div><strong>${escapeHtml(item[1])}</strong><span>${escapeHtml(item[0])}</span></div>`).join('');
  }
  async function refreshSummary(){
    state.bootstrap.summary=await call('getSystemSummary');
    renderSummary();
  }
  function switchType(type){
    state.type=type;state.page=1;
    $('tabAnnual').classList.toggle('active',type==='annual');$('tabMonthly').classList.toggle('active',type==='monthly');
    ['monthField','householdField'].forEach(id=>$(id).classList.toggle('hidden',type==='annual'));
    ['harvestedField','productionField','sourceYieldField'].forEach(id=>$(id).classList.toggle('hidden',type==='monthly'));
    $('formTitle').textContent=type==='annual'?'เพิ่มข้อมูลรายปี':'เพิ่มข้อมูลรายเดือน';
    renderSummary();resetForm();loadRecords(1);
  }
  function fieldValue(id){const value=$(id).value.trim();return value===''?null:value}
  function formData(){
    const base={year_be:fieldValue('year_be'),district_code:fieldValue('district_code'),crop_code:fieldValue('crop_code'),planted_area_rai:fieldValue('planted_area_rai'),record_status:fieldValue('record_status'),source_sheet:fieldValue('source_sheet')};
    if(state.type==='annual')Object.assign(base,{record_id:fieldValue('recordId'),harvested_area_rai:fieldValue('harvested_area_rai'),production_ton:fieldValue('production_ton'),source_yield_harvested_kg_per_rai:fieldValue('source_yield_harvested_kg_per_rai')});
    else Object.assign(base,{monthly_record_id:fieldValue('recordId'),month_number:fieldValue('month_number'),farmer_households:fieldValue('farmer_households')});
    return base;
  }
  async function submitForm(event){
    event.preventDefault();busy(true);
    try{
      const result=await call('saveRecord',{type:state.type,data:formData()});
      notify(result.action==='CREATE'?'เพิ่มข้อมูลสำเร็จ':'แก้ไขข้อมูลสำเร็จ');
      resetForm();await Promise.all([loadRecords(1),refreshSummary()]);
    }catch(error){notify(error.message,true)}finally{busy(false)}
  }
  function resetForm(){
    $('recordForm').reset();$('recordId').value='';$('source_sheet').value='Data Manager';$('record_status').value='active';
    $('formTitle').textContent=state.type==='annual'?'เพิ่มข้อมูลรายปี':'เพิ่มข้อมูลรายเดือน';
    $('saveButton').textContent='บันทึกข้อมูล';
  }
  async function editRecord(id){
    busy(true);
    try{
      const record=await call('getRecord',{type:state.type,id});
      $('recordId').value=id;
      ['year_be','district_code','crop_code','planted_area_rai','record_status','source_sheet','month_number','farmer_households','harvested_area_rai','production_ton','source_yield_harvested_kg_per_rai'].forEach(key=>{if($(key))$(key).value=record[key]??''});
      $('formTitle').textContent='แก้ไข '+id;$('saveButton').textContent='บันทึกการแก้ไข';window.scrollTo({top:0,behavior:'smooth'});
    }catch(error){notify(error.message,true)}finally{busy(false)}
  }
  async function setArchive(id,isArchived){
    if(!confirm(isArchived?'นำระเบียนนี้กลับมาเผยแพร่?':'เก็บระเบียนนี้ออกจาก Dashboard?'))return;
    busy(true);
    try{await call(isArchived?'restoreRecord':'archiveRecord',{type:state.type,id});notify(isArchived?'กู้คืนข้อมูลแล้ว':'เก็บข้อมูลถาวรแล้ว');await Promise.all([loadRecords(state.page),refreshSummary()])}
    catch(error){notify(error.message,true)}finally{busy(false)}
  }
  async function hardDelete(id){
    const confirmation=prompt('การลบถาวรจะสำรองข้อมูลเดิมก่อนลบ\\nพิมพ์รหัสระเบียนเพื่อยืนยัน:', '');
    if(confirmation!==id)return notify('ยกเลิกการลบ: รหัสยืนยันไม่ตรง',true);
    busy(true);
    try{await call('deleteRecordPermanently',{type:state.type,id,confirmation});notify('ลบข้อมูลถาวรแล้ว (มีสำรองใน _Row_Backups)');await Promise.all([loadRecords(1),refreshSummary()])}
    catch(error){notify(error.message,true)}finally{busy(false)}
  }
  async function loadRecords(page){
    if(page<1)return;
    busy(true);
    try{
      const result=await call('listRecords',{type:state.type,page,pageSize:state.pageSize,search:$('search').value,status:$('statusFilter').value});
      Object.assign(state,{page:result.page,total:result.total});
      const idKey=state.type==='annual'?'record_id':'monthly_record_id';
      $('recordList').innerHTML=result.rows.length?result.rows.map(row=>{
        const id=row[idKey],arch=row.record_status==='archived';
        return `<div class="row ${arch?'archived':''}"><div class="rowtop"><div><strong>${escapeHtml(id)}</strong> <span class="badge ${arch?'arch':''}">${escapeHtml(row.record_status)}</span><div class="meta">${escapeHtml(row.year_be)} · ${escapeHtml(row.month_name_th||'')} ${escapeHtml(row.district_name)} · ${escapeHtml(row.crop_name)}</div></div><div class="rowbuttons"><button class="icon" onclick="editRecord('${escapeHtml(id)}')">แก้ไข</button><button class="icon" onclick="setArchive('${escapeHtml(id)}',${arch})">${arch?'คืนค่า':'เก็บ'}</button><button class="icon" onclick="hardDelete('${escapeHtml(id)}')">ลบ</button></div></div></div>`;
      }).join(''):'<div class="meta">ไม่พบข้อมูล</div>';
      const pages=Math.max(1,Math.ceil(result.total/result.pageSize));$('pageInfo').textContent=`หน้า ${result.page}/${pages} · ${result.total} รายการ`;
      $('prev').disabled=result.page<=1;$('next').disabled=result.page>=pages;
    }catch(error){notify(error.message,true)}finally{busy(false)}
  }
  function scheduleSearch(){clearTimeout(state.timer);state.timer=setTimeout(()=>loadRecords(1),350)}
  async function integrityCheck(){
    busy(true);try{const r=await call('runIntegrityCheck');notify(`ตรวจแล้ว: รายปี ${r.annual.issueCount} ปัญหา · รายเดือน ${r.monthly.issueCount} ปัญหา`,r.annual.issueCount+r.monthly.issueCount>0)}
    catch(error){notify(error.message,true)}finally{busy(false)}
  }
  async function fullBackup(){
    busy(true);try{const r=await call('createFullBackup');notify(`สำรองสำเร็จ: ${r.name}`)}
    catch(error){notify(error.message,true)}finally{busy(false)}
  }
  async function refreshAccess(){try{const a=await call('getAdminAccess');$('accessInfo').textContent=`บัญชี ${a.email||'ไม่พบอีเมล'} · สิทธิ์ ${a.role}`;$('importButton').disabled=!a.canImport;$('requestButton').classList.toggle('hidden',a.role!=='viewer'&&a.role!=='rejected')}catch(e){$('accessInfo').textContent=e.message;$('importButton').disabled=true}}
  async function requestAccess(){try{const name=prompt('ชื่อผู้ขอสิทธิ์ผู้ช่วยดูแลระบบ:','');if(!name)return;await call('requestAssistantAdmin',name);notify('ส่งคำขอแล้ว รอผู้ดูแลหลักอนุมัติ');await refreshAccess()}catch(e){notify(e.message,true)}}
  function readTextFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=()=>reject(new Error('อ่านไฟล์ไม่สำเร็จ'));reader.readAsText(file,'UTF-8')})}
  async function importCsv(){const file=$('csvFile').files[0];if(!file)return notify('กรุณาเลือกไฟล์ CSV',true);busy(true);try{const crop=state.bootstrap.crops.find(x=>String(x.code)===$('importCrop').value);const r=await call('importCsvV5',{kind:$('importKind').value,csv:await readTextFile(file),cropCode:crop&&crop.code,cropName:crop&&crop.name,metricType:$('metricType').value,sourceFile:file.name});notify(`นำเข้าสำเร็จ ${r.rows} แถว · Batch ${r.batchId}`);$('csvFile').value=''}catch(e){notify(e.message,true)}finally{busy(false)}}
  init();
</script>
</body>
</html>
